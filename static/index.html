<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuga CS Demo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #262a33;
    --text: #e8e9ec; --muted: #8b909c; --accent: #ff5a1f;
    --win: #2fb36b; --lose: #e0474c;
    --t: #e8b14a; --ct: #5b9dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-bottom: 28px; }

  .drop { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 40px 16px;
          text-align: center; background: var(--panel); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop b { color: var(--accent); }
  .drop small { color: var(--muted); display: block; margin-top: 6px; }
  input[type=file] { display: none; }

  .status { margin-top: 16px; color: var(--muted); min-height: 22px; }
  .status.err { color: var(--lose); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .result { display: none; margin-top: 32px; }
  .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .chip b { color: var(--accent); }

  h2 { font-size: 18px; margin: 28px 0 10px; }
  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  .team-head td { background: #1f232c; color: var(--accent); font-weight: 600; text-align: left; }
  .good { color: var(--win); } .bad { color: var(--lose); }

  .duel td { text-align: center; min-width: 70px; }
  .duel th { text-align: center; }
  .cell { border-radius: 6px; padding: 4px 6px; display: inline-block; min-width: 52px; }

  /* --- 2D-реплей --- */
  .rounds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .rbtn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
          padding: 4px 0; width: 38px; cursor: pointer; font: inherit; font-size: 13px; border-bottom-width: 3px; }
  .rbtn.t { border-bottom-color: var(--t); } .rbtn.ct { border-bottom-color: var(--ct); }
  .rbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .replay { display: grid; grid-template-columns: minmax(0, 640px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .replay { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: #0b0d11; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .controls button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px;
                     font: inherit; cursor: pointer; min-width: 74px; }
  .controls select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
                     border-radius: 8px; padding: 5px; font: inherit; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; text-align: right; }

  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 120px; }
  .feed h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .kill { display: flex; gap: 6px; align-items: baseline; padding: 4px 0; font-size: 14px; flex-wrap: wrap; }
  .kill .w { color: var(--muted); font-size: 12px; }
  .kill .tm { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .tc { color: var(--t); } .ctc { color: var(--ct); }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .kill.bomb { color: var(--muted); font-style: italic; }

  /* Поиск игрока FACEIT */
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line);
                  border-radius: 10px; padding: 10px 14px; font: inherit; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
                   font: inherit; font-weight: 600; cursor: pointer; }
  .pcard { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .pcard img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #2a2f3a; }
  .pcard .nm { font-size: 18px; font-weight: 700; }
  .pcard .lv { margin-left: auto; text-align: right; }
  .pcard .lv b { font-size: 22px; color: var(--accent); }
  .mlist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
  .mrow { display: grid; grid-template-columns: 6px 110px 1fr 70px 60px 60px 90px; gap: 12px; align-items: center;
          background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 8px 0;
          font-size: 14px; overflow: hidden; }
  .mrow .rs { align-self: stretch; }
  .mrow .rs.w { background: var(--win); } .mrow .rs.l { background: var(--lose); } .mrow .rs.n { background: var(--line); }
  .mrow .mp { font-weight: 600; } .mrow .dt { color: var(--muted); font-size: 12px; }
  .mrow .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mrow a { color: var(--accent); text-decoration: none; text-align: right; font-weight: 600; }
  .mrow a:hover { text-decoration: underline; }
  @media (max-width: 700px) { .mrow { grid-template-columns: 6px 1fr 60px 70px; } .mrow .hide { display: none; } }

  /* Хайлайты */
  .hl { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
  .hcard { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer;
           color: var(--text); font: inherit; text-align: left; transition: .15s; }
  .hcard:hover { border-color: var(--accent); transform: translateY(-1px); }
  .hcard .bd { font-weight: 800; font-size: 14px; border-radius: 8px; padding: 6px 8px; min-width: 46px; text-align: center; }
  .bd.ace { background: linear-gradient(135deg, #ffd34d, #ff8a1f); color: #1a1205; }
  .bd.k4 { background: #ff5a1f; color: #fff; } .bd.k3 { background: #3a3f4b; color: #fff; }
  .bd.cl { background: #7b4dff; color: #fff; }
  .hcard .hn { font-weight: 600; font-size: 14px; }
  .hcard .hs { color: var(--muted); font-size: 12px; }

  /* Таблица команд в реплее */
  .side { display: flex; flex-direction: column; gap: 12px; }
  .tpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .thead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1f232c; font-weight: 600; }
  .thead .tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #0f1115; }
  .thead .tag.t { background: var(--t); } .thead .tag.ct { background: var(--ct); }
  .thead .sc { margin-left: auto; font-size: 18px; font-variant-numeric: tabular-nums; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) 44px auto 74px 56px; gap: 8px;
          align-items: center; padding: 5px 12px; font-size: 13px; border-top: 1px solid var(--line); }
  .prow.dead { opacity: .38; }
  .prow .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .prow .hpb { height: 5px; background: #000; border-radius: 3px; overflow: hidden; }
  .prow .hpb i { display: block; height: 100%; }
  .prow .nd { display: flex; gap: 3px; color: var(--muted); font-size: 11px; min-width: 0; }
  .prow .nd b { color: #fff; background: #2a2f3a; border-radius: 3px; padding: 0 4px; font-weight: 600; }
  .prow .nd .c4 { background: #a3241c; }
  .prow .wp { color: var(--muted); font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .mn { color: #e8c547; text-align: right; font-variant-numeric: tabular-nums; }

  .score { display: flex; align-items: center; justify-content: center; gap: 16px;
           background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 10px 16px; margin-bottom: 12px; font-weight: 600; }
  .score .num { font-size: 26px; font-variant-numeric: tabular-nums; }
  .score .sep { color: var(--muted); }
  .score .lead { color: var(--win); }
  .score .small { color: var(--muted); font-weight: 400; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Nuga <span>CS</span> Demo</h1>
  <div class="sub">Загрузите демку CS2 с FACEIT — получите статистику, матрицу дуэлей и 2D-реплей.</div>

  <h2 style="margin-top:0">Игрок FACEIT</h2>
  <form class="search" id="search">
    <input id="nick" placeholder="Введите ник на FACEIT, например Nuga_006" autocomplete="off">
    <button type="submit">Найти</button>
  </form>
  <div id="player"></div>

  <h2>Разбор демки</h2>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".dem,.gz,.zst">
    <div><b>Выберите файл</b> или перетащите его сюда</div>
    <small>.dem, .dem.gz или .dem.zst</small>
  </label>
  <div class="status" id="status"></div>
  <div class="bar" id="bar"><div></div></div>

  <div class="result" id="result">
    <div class="meta" id="meta"></div>

    <h2>Хайлайты</h2>
    <div class="hl" id="highlights"></div>

    <h2>2D-реплей</h2>
    <div class="score" id="score"></div>
    <div class="rounds" id="rounds"></div>
    <div class="replay">
      <div class="stage">
        <canvas id="canvas" width="1024" height="1024"></canvas>
        <div class="controls">
          <button id="play">▶ Play</button>
          <select id="speed">
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
          </select>
          <input type="range" id="seek" min="0" max="0" step="0.01" value="0">
          <span class="time" id="time">0:00</span>
        </div>
        <div class="note" id="radarNote"></div>
      </div>
      <div class="side">
        <div id="teams"></div>
        <div class="feed">
          <h3>Киллфид раунда</h3>
          <div id="feed"></div>
        </div>
      </div>
    </div>

    <h2>Статистика игроков</h2>
    <div class="scroll"><table id="stats"></table></div>
    <h2>Матрица дуэлей</h2>
    <div class="sub" style="margin:0 0 10px">Число слева — сколько раз игрок строки убил игрока столбца, справа — наоборот.</div>
    <div class="scroll"><table class="duel" id="duels"></table></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), statusEl = $("status"), bar = $("bar");

// Защита от "вредных" ников: превращаем спецсимволы в безопасный текст
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = "status" + (isError ? " err" : "");
}

// ---------- Поиск игрока FACEIT ----------
$("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nick = $("nick").value.trim();
  if (!nick) return;
  $("player").innerHTML = `<div class="note">Ищем ${esc(nick)}...</div>`;
  try {
    const res = await fetch(`/api/faceit/player?nickname=${encodeURIComponent(nick)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    renderPlayer(data);
  } catch (err) {
    $("player").innerHTML = `<div class="status err">${esc(err.message)}</div>`;
  }
});

function renderPlayer(p) {
  const date = (ts) => ts ? new Date(ts * 1000).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) : "";
  const mapName = (m) => (m || "?").replace(/^de_/, "").replace(/^./, (c) => c.toUpperCase());

  const rows = p.matches.map((m) => {
    const rs = m.won === true ? "w" : m.won === false ? "l" : "n";
    return `<div class="mrow"><span class="rs ${rs}"></span>` +
      `<span><div class="mp">${esc(mapName(m.map))}</div><div class="dt">${date(m.finished_at)}</div></span>` +
      `<span class="num" style="text-align:left">${esc(m.score || "")}</span>` +
      `<span class="num">${m.kills ?? "-"} / ${m.deaths ?? "-"}</span>` +
      `<span class="num hide">${m.kd ?? ""}</span>` +
      `<span class="num hide">${m.adr ? Math.round(m.adr) : ""}</span>` +
      `<a href="${esc(m.url)}" target="_blank" rel="noopener">Комната ↗</a></div>`;
  }).join("");

  $("player").innerHTML =
    `<div class="pcard">${p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : `<img alt="">`}` +
    `<div><div class="nm">${esc(p.nickname)}</div>` +
    `<div class="note" style="margin:0">${p.country ? esc(p.country.toUpperCase()) + " · " : ""}` +
    `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--muted)">профиль FACEIT ↗</a></div></div>` +
    `<div class="lv"><div class="note" style="margin:0">Уровень ${p.level ?? "-"}</div><b>${p.elo ?? "-"}</b> ELO</div></div>` +
    (rows
      ? `<div class="note" style="margin:0 0 8px">Последние матчи. Чтобы разобрать матч: откройте «Комнату», нажмите «Watch demo» и загрузите файл ниже.</div>` +
        `<div class="mrow" style="background:none;border:0;color:var(--muted);font-size:12px;padding-top:0;padding-bottom:0">` +
        `<span></span><span>Карта</span><span>Счёт</span><span class="num">K / D</span><span class="num hide">K/D</span><span class="num hide">ADR</span><span></span></div>` +
        `<div class="mlist">${rows}</div>`
      : `<div class="note">Нет матчей CS2</div>`);
}

// ---------- Загрузка файла ----------
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files[0]) upload(fileInput.files[0]); });

function upload(file) {
  $("result").style.display = "none";
  stop();
  bar.style.display = "block";
  bar.firstElementChild.style.width = "0";
  setStatus(`Загружаем ${file.name}...`);

  const form = new FormData();
  form.append("file", file);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/analyze");

  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round((e.loaded / e.total) * 100);
    bar.firstElementChild.style.width = pct + "%";
    if (pct === 100) setStatus("Разбираем демку... это может занять до минуты");
  };
  xhr.onload = () => {
    bar.style.display = "none";
    let data;
    try { data = JSON.parse(xhr.responseText); } catch { data = {}; }
    if (xhr.status !== 200) return setStatus(data.detail || "Ошибка сервера", true);
    setStatus("Готово!");
    render(data);
  };
  xhr.onerror = () => { bar.style.display = "none"; setStatus("Нет связи с сервером", true); };
  xhr.send(form);
}

// ---------- Таблицы ----------
function render(data) {
  const teams = [...new Set(data.players.map((p) => p.team))].sort();
  const byTeam = (t) => data.players.filter((p) => p.team === t).sort((a, b) => b.kills - a.kills);
  const teamName = (i) => `Команда ${i + 1}`;

  $("meta").innerHTML =
    `<div class="chip">Карта: <b>${esc(data.map)}</b></div>` +
    `<div class="chip">Раундов: <b>${data.rounds}</b></div>`;

  let html = "<tr><th>Игрок</th><th>K</th><th>D</th><th>A</th><th>K/D</th><th>HS%</th><th>ADR</th></tr>";
  teams.forEach((t, i) => {
    html += `<tr class="team-head"><td colspan="7">${teamName(i)}</td></tr>`;
    for (const p of byTeam(t)) {
      const kdClass = p.kd >= 1 ? "good" : "bad";
      html += `<tr><td>${esc(p.name)}</td><td>${p.kills}</td><td>${p.deaths}</td><td>${p.assists}</td>` +
              `<td class="${kdClass}">${p.kd.toFixed(2)}</td><td>${p.hs}%</td><td>${p.adr}</td></tr>`;
    }
  });
  $("stats").innerHTML = html;

  if (teams.length >= 2) {
    const rows = byTeam(teams[0]), cols = byTeam(teams[1]);
    const count = (a, v) => (data.duels[a.steamid] || {})[v.steamid] || 0;
    let d = "<tr><th></th>" + cols.map((c) => `<th>${esc(c.name)}</th>`).join("") + "</tr>";
    for (const r of rows) {
      d += `<tr><td>${esc(r.name)}</td>`;
      for (const c of cols) {
        const won = count(r, c), lost = count(c, r);
        const color = won > lost ? "rgba(47,179,107,.25)" : won < lost ? "rgba(224,71,76,.25)" : "transparent";
        d += `<td><span class="cell" style="background:${color}">${won} : ${lost}</span></td>`;
      }
      d += "</tr>";
    }
    $("duels").innerHTML = d;
  } else {
    $("duels").innerHTML = "";
  }

  $("result").style.display = "block";
  setupReplay(data);
}

// ---------- 2D-реплей ----------

// Параметры радаров: где на картинке 1024x1024 находится точка (0,0) карты и масштаб.
// Картинку радара кладём в static/maps/<название_карты>.png
const MAPS = {
  de_ancient:  { x: -2953, y: 2164, scale: 5 },
  de_anubis:   { x: -2796, y: 3328, scale: 5.22 },
  de_dust2:    { x: -2476, y: 3239, scale: 4.4 },
  de_inferno:  { x: -2087, y: 3870, scale: 4.9 },
  de_mirage:   { x: -3230, y: 1713, scale: 5 },
  de_nuke:     { x: -3453, y: 2887, scale: 7 },
  de_overpass: { x: -4831, y: 1781, scale: 5.2 },
  de_train:    { x: -2308, y: 2078, scale: 4.082077 },
  de_vertigo:  { x: -3168, y: 1762, scale: 4 },
};
const TICKRATE = 64;

const canvas = $("canvas"), ctx = canvas.getContext("2d");
const R = {
  data: null, round: 0, pos: 0, playing: false, lastTs: 0,
  radar: null, bounds: null,
};

const teamColor = (team) => (team === 2 ? "#e8b14a" : team === 3 ? "#5b9dff" : "#999");
const winnerSide = (w) => {
  w = String(w).toUpperCase();
  return w === "2" || w === "T" ? "t" : w === "3" || w === "CT" ? "ct" : "";
};
const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;

function setupReplay(data) {
  R.data = data;
  R.radar = null;
  const rounds = data.replay?.rounds || [];

  // Кнопки раундов (снизу цвет победителя: жёлтый — T, синий — CT)
  $("rounds").innerHTML = rounds.map((r, i) =>
    `<button class="rbtn ${winnerSide(r.winner)}" data-i="${i}">${i + 1}</button>`).join("");
  $("rounds").querySelectorAll(".rbtn").forEach((b) =>
    b.addEventListener("click", () => selectRound(+b.dataset.i)));

  // Границы карты по всем позициям — нужны, если нет картинки радара
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const r of rounds) for (const f of r.frames) for (const p of f) {
    if (!p) continue;
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
    minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  }
  R.bounds = { minX, maxX, minY, maxY };

  // Кто выиграл каждый раунд: 0 — «Команда 1», 1 — «Команда 2».
  // Команды меняются сторонами, поэтому смотрим, за какую сторону играла Команда 1 в этом раунде.
  const teams = [...new Set(data.players.map((p) => p.team))].sort();
  const teamOneIdx = data.players.map((p, i) => (p.team === teams[0] ? i : -1)).filter((i) => i >= 0);
  R.roundWinners = rounds.map((r) => {
    const f = r.frames[0] || [];
    const i = teamOneIdx.find((j) => f[j]);
    if (i === undefined) return -1;
    const teamOneSide = f[i][3] === 2 ? "t" : "ct";
    const w = winnerSide(r.winner);
    return w ? (w === teamOneSide ? 0 : 1) : -1;
  });

  renderHighlights(data);

  // Пробуем загрузить картинку радара
  const map = data.map;
  $("radarNote").textContent = "";
  loadMapData().then(() => loadRadar(map));
  if (rounds.length) selectRound(0);
}

// Точные параметры карт из static/maps/map_data.json (файл из awpy).
// Если файла нет — остаются примерные значения из MAPS выше.
let mapDataLoaded = false;
async function loadMapData() {
  if (mapDataLoaded) return;
  mapDataLoaded = true;
  try {
    const res = await fetch("/static/maps/map_data.json");
    if (!res.ok) return;
    const json = await res.json();
    for (const [name, m] of Object.entries(json)) {
      if (m && m.pos_x != null && m.pos_y != null && m.scale != null) {
        MAPS[name] = { x: Number(m.pos_x), y: Number(m.pos_y), scale: Number(m.scale) };
      }
    }
  } catch { /* файла нет — ничего страшного */ }
}

function loadRadar(map) {
  if (MAPS[map]) {
    const img = new Image();
    img.onload = () => { R.radar = img; draw(); };
    img.onerror = () => {
      $("radarNote").textContent = `Нет картинки радара: положите её в static/maps/${map}.png`;
    };
    img.src = `/static/maps/${map}.png`;
  } else {
    $("radarNote").textContent = `Для карты ${map} пока нет настроек радара — показываем без фона.`;
  }
}

function selectRound(i) {
  stop();
  R.round = i;
  R.pos = 0;
  const r = R.data.replay.rounds[i];
  $("seek").max = Math.max(r.frames.length - 1, 0);
  $("seek").value = 0;
  $("rounds").querySelectorAll(".rbtn").forEach((b, j) => b.classList.toggle("active", j === i));
  renderScore(i);
  draw();
}

// Счёт после выбранного раунда
function renderScore(i) {
  const won = [0, 0];
  R.roundWinners.slice(0, i + 1).forEach((w) => { if (w >= 0) won[w]++; });
  const total = [0, 0];
  R.roundWinners.forEach((w) => { if (w >= 0) total[w]++; });
  const cls = (a, b) => (a > b ? "num lead" : "num");
  $("score").innerHTML =
    `<span>Команда 1</span>` +
    `<span class="${cls(won[0], won[1])}">${won[0]}</span><span class="sep">:</span>` +
    `<span class="${cls(won[1], won[0])}">${won[1]}</span>` +
    `<span>Команда 2</span>` +
    `<span class="small">после ${i + 1}-го раунда · итог ${total[0]}:${total[1]}</span>`;
}

// Перевод координат игры в пиксели на холсте
function toCanvas(x, y) {
  const m = MAPS[R.data.map];
  if (R.radar && m) {
    const k = canvas.width / 1024;
    return [((x - m.x) / m.scale) * k, ((m.y - y) / m.scale) * k];
  }
  // Без радара: вписываем все позиции в квадрат с отступами
  const b = R.bounds, pad = 60;
  const size = Math.max(b.maxX - b.minX, b.maxY - b.minY) || 1;
  const s = (canvas.width - pad * 2) / size;
  const offX = (canvas.width - (b.maxX - b.minX) * s) / 2;
  const offY = (canvas.height - (b.maxY - b.minY) * s) / 2;
  return [offX + (x - b.minX) * s, offY + (b.maxY - y) * s];
}

function draw() {
  const r = R.data?.replay?.rounds?.[R.round];
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!r || !r.frames.length) return;

  if (R.radar) ctx.drawImage(R.radar, 0, 0, canvas.width, canvas.height);

  // Плавное движение: смешиваем два соседних кадра
  const a = Math.floor(R.pos), b = Math.min(a + 1, r.frames.length - 1), t = R.pos - a;
  const fa = r.frames[a], fb = r.frames[b];
  const curTick = r.ticks[a] + t * (r.ticks[b] - r.ticks[a]);

  drawGrenades(r, curTick);
  drawShots(r, curTick);
  drawBomb(r, curTick);

  ctx.font = "bold 20px system-ui, sans-serif";
  ctx.textAlign = "center";
  R.data.players.forEach((pl, i) => {
    const p = fa[i];
    if (!p) return;
    const q = fb[i] && fb[i][2] ? fb[i] : p;
    const [x, y] = toCanvas(p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t);
    const color = teamColor(p[3]);

    if (p[2]) {
      // Куда смотрит игрок: плавно поворачиваем между кадрами (по кратчайшему пути через 360°)
      if (p[6] != null) {
        let yaw = p[6];
        if (q[6] != null) yaw += (((q[6] - p[6] + 540) % 360) - 180) * t;
        drawView(x, y, yaw, color);
      }

      // Живой игрок — кружок и ник
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#0b0d11"; ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px system-ui, sans-serif";
      ctx.fillText(pl.name, x, y - 18);

      // Полоска HP под игроком: зелёная → жёлтая → красная
      const hp = Math.max(0, Math.min(100, p[4] ?? 100));
      const w = 34, h = 5, bx = x - w / 2, by = y + 16;
      ctx.fillStyle = "rgba(0,0,0,.7)";
      ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
      ctx.fillStyle = hp > 60 ? "#2fb36b" : hp > 25 ? "#e8b14a" : "#e0474c";
      ctx.fillRect(bx, by, (w * hp) / 100, h);

      // Оружие в руках
      if (p[5]) {
        ctx.font = "15px system-ui, sans-serif";
        ctx.fillStyle = "rgba(232,233,236,.75)";
        ctx.fillText(p[5], x, by + 20);
      }
    } else {
      // Мёртвый — крестик на месте смерти
      ctx.strokeStyle = color; ctx.globalAlpha = 0.7; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - 9, y - 9); ctx.lineTo(x + 9, y + 9);
      ctx.moveTo(x + 9, y - 9); ctx.lineTo(x - 9, y + 9);
      ctx.stroke(); ctx.globalAlpha = 1;
    }
  });

  // Время раунда и киллфид
  $("time").textContent = fmtTime((curTick - r.start) / TICKRATE);
  $("seek").value = R.pos;
  renderFeed(r, curTick);
  renderTeams(r, fa, curTick);
}

// Карточки хайлайтов: клик — переход в реплей за 3 секунды до момента
function renderHighlights(data) {
  const list = data.replay?.highlights || [];
  if (!list.length) {
    $("highlights").innerHTML = `<div class="note">В этом матче не нашлось мульти-киллов и клатчей</div>`;
    return;
  }
  const badge = (t) => (t === "ACE" ? "ace" : t === "4K" ? "k4" : t === "3K" ? "k3" : "cl");
  $("highlights").innerHTML = list.map((h, i) =>
    `<button class="hcard" data-i="${i}"><span class="bd ${badge(h.type)}">${esc(h.type)}</span>` +
    `<span><div class="hn">${esc(data.players[h.player]?.name ?? "?")}</div>` +
    `<div class="hs">Раунд ${h.round + 1} · ${esc(h.detail)}</div></span></button>`).join("");
  $("highlights").querySelectorAll(".hcard").forEach((b) =>
    b.addEventListener("click", () => jumpTo(list[+b.dataset.i])));
}

function jumpTo(h) {
  selectRound(h.round);
  const r = R.data.replay.rounds[h.round];
  const from = h.tick - 3 * TICKRATE;
  const i = r.ticks.findIndex((t) => t >= from);
  R.pos = Math.max(0, i);
  draw();
  play();
  document.querySelector(".replay").scrollIntoView({ behavior: "smooth", block: "center" });
}

// Перевод расстояния в игровых единицах в пиксели на холсте
function unitsToPx(x, y, units) {
  const [ax] = toCanvas(x, y), [bx] = toCanvas(x + units, y);
  return Math.abs(bx - ax);
}

// Смоки, молотовы, флешки и HE на карте
function drawGrenades(r, curTick) {
  for (const g of r.grenades || []) {
    if (curTick < g.start || curTick > g.end) continue;
    const [x, y] = toCanvas(g.x, g.y);
    const age = curTick - g.start, left = g.end - curTick;
    // Плавное появление и исчезание
    const fade = Math.min(1, age / 32, left / 32);

    if (g.type === "smoke") {
      const rad = unitsToPx(g.x, g.y, 144);           // радиус смока в игре ~144 единицы
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(205,210,220,${0.6 * fade})`; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,255,255,${0.5 * fade})`; ctx.stroke();
    } else if (g.type === "molotov") {
      const rad = unitsToPx(g.x, g.y, 120);
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,110,30,${0.45 * fade})`; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,170,60,${0.8 * fade})`; ctx.stroke();
    } else {
      // Флешка — белая вспышка, HE — красное кольцо; быстро гаснут
      const k = 1 - age / 32;
      const rad = unitsToPx(g.x, g.y, g.type === "flash" ? 90 : 110) * (0.6 + 0.4 * (1 - k));
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      if (g.type === "flash") { ctx.fillStyle = `rgba(255,255,255,${0.7 * k})`; ctx.fill(); }
      else { ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,70,40,${0.9 * k})`; ctx.stroke(); }
    }
  }
}

// Трассеры выстрелов: короткая линия, которая гаснет за ~0.2 секунды
function drawShots(r, curTick) {
  const LIFE = 12, LEN = 700;                          // сколько тиков видно линию и её длина в игре
  for (const [tick, sx, sy, yaw, team] of r.shots || []) {
    const dt = curTick - tick;
    if (dt < 0 || dt > LIFE) continue;
    const ang = (yaw * Math.PI) / 180;
    const [x1, y1] = toCanvas(sx, sy);
    const [x2, y2] = toCanvas(sx + Math.cos(ang) * LEN, sy + Math.sin(ang) * LEN);
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    const a = 1 - dt / LIFE;
    g.addColorStop(0, hexToRgba(teamColor(team), 0.95 * a));
    g.addColorStop(1, hexToRgba(teamColor(team), 0));
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineWidth = 3; ctx.strokeStyle = g; ctx.stroke();
  }
}

// Таблица команд: деньги, оружие, гранаты, HP; мёртвые — серые
function renderTeams(r, frame, curTick) {
  const teams = [...new Set(R.data.players.map((p) => p.team))].sort();
  const lastTick = r.ticks[r.ticks.length - 1];
  const roundOver = curTick >= lastTick;

  const panels = teams.map((t, ti) => {
    const idx = R.data.players.map((p, i) => (p.team === t ? i : -1)).filter((i) => i >= 0);
    const any = idx.find((i) => frame[i]);
    const side = any !== undefined ? frame[any][3] : 0;     // 2 = T, 3 = CT в этом раунде

    // Счёт: выигранные раунды до этого + этот, если он уже закончился
    let score = R.roundWinners.slice(0, R.round).filter((w) => w === ti).length;
    if (roundOver && R.roundWinners[R.round] === ti) score++;

    const rows = idx
      .map((i) => ({ pl: R.data.players[i], p: frame[i] }))
      .sort((a, b) => (b.p?.[2] ?? 0) - (a.p?.[2] ?? 0) || (b.p?.[7] ?? 0) - (a.p?.[7] ?? 0))
      .map(({ pl, p }) => {
        if (!p) return "";
        const alive = p[2] === 1;
        const hp = alive ? p[4] : 0;
        const hpColor = hp > 60 ? "#2fb36b" : hp > 25 ? "#e8b14a" : "#e0474c";
        const nades = alive ? [...(p[8] || "")].map((c) => `<b>${c}</b>`).join("") : "";
        const bomb = alive && p[9] ? `<b class="c4">C4</b>` : "";
        return `<div class="prow${alive ? "" : " dead"}">` +
          `<span class="pn">${esc(pl.name)}</span>` +
          `<span class="hpb"><i style="width:${hp}%;background:${hpColor}"></i></span>` +
          `<span class="nd">${bomb}${nades}</span>` +
          `<span class="wp">${alive ? esc(p[5]) : ""}</span>` +
          `<span class="mn">$${p[7] ?? 0}</span></div>`;
      }).join("");

    const tag = side === 2 ? `<span class="tag t">T</span>` : side === 3 ? `<span class="tag ct">CT</span>` : "";
    return { side, html: `<div class="tpanel"><div class="thead">${tag}<span>Команда ${ti + 1}</span>` +
      `<span class="sc">${score}</span></div>${rows}</div>` };
  });

  // Как в CSDEMO: CT сверху, T снизу
  panels.sort((a, b) => b.side - a.side);
  $("teams").innerHTML = panels.map((p) => p.html).join("");
}

// Конус обзора и стрелка взгляда.
// В игре 0° — это восток, 90° — север. На холсте ось Y смотрит вниз, поэтому угол берём с минусом.
function drawView(x, y, yaw, color) {
  const ang = (-yaw * Math.PI) / 180;
  const reach = 90, half = (22 * Math.PI) / 180;   // длина конуса и половина угла обзора

  const g = ctx.createRadialGradient(x, y, 0, x, y, reach);
  g.addColorStop(0, hexToRgba(color, 0.45));
  g.addColorStop(1, hexToRgba(color, 0));
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, reach, ang - half, ang + half);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();

  // Короткая стрелка точно по направлению взгляда
  const ex = x + Math.cos(ang) * 26, ey = y + Math.sin(ang) * 26;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#fff";
  ctx.stroke();
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// Значок бомбы: красный — заложена, зелёный — разминирована, оранжевый взрыв — взорвалась
function drawBomb(r, curTick) {
  const events = (r.bomb || []).filter((b) => b.tick <= curTick);
  const plant = events.find((b) => b.type === "planted");
  if (!plant || plant.x == null) return;
  const defused = events.some((b) => b.type === "defused");
  const exploded = events.some((b) => b.type === "exploded");
  const [x, y] = toCanvas(plant.x, plant.y);

  if (exploded) {
    ctx.beginPath();
    ctx.arc(x, y, 40, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,90,31,.35)";
    ctx.fill();
  }
  // Мигание, пока бомба тикает
  const blink = !defused && !exploded && Math.floor(curTick / 32) % 2 === 0;
  ctx.fillStyle = defused ? "#2fb36b" : blink ? "#ff3b30" : "#a3241c";
  ctx.fillRect(x - 12, y - 9, 24, 18);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("C4", x, y + 4);
}

function renderFeed(r, curTick) {
  const team = {};
  // Команда игрока в текущем кадре — чтобы покрасить ники в киллфиде
  const frame = r.frames[Math.floor(R.pos)];
  R.data.players.forEach((pl, i) => { if (frame[i]) team[pl.name] = frame[i][3]; });
  const cls = (name) => (team[name] === 2 ? "tc" : team[name] === 3 ? "ctc" : "");

  const tm = (tick) => `<span class="tm">${fmtTime((tick - r.start) / TICKRATE)}</span>`;
  const bombText = { planted: "заложил бомбу", defused: "разминировал бомбу", exploded: "Бомба взорвалась" };

  // Убийства и события бомбы в одном списке по времени
  const items = [
    ...r.kills.map((k) => ({ tick: k.tick, html:
      `<div class="kill"><span class="${cls(k.attacker)}">${esc(k.attacker)}</span>` +
      `<span class="w">[${esc(k.weapon)}${k.headshot ? " · HS" : ""}]</span>` +
      `<span class="${cls(k.victim)}">${esc(k.victim)}</span>${tm(k.tick)}</div>` })),
    ...(r.bomb || []).map((b) => ({ tick: b.tick, html:
      `<div class="kill bomb">💣 ${b.type === "exploded" ? "" : `<span class="${cls(b.player)}">${esc(b.player)}</span>`} ` +
      `${bombText[b.type]}${tm(b.tick)}</div>` })),
  ].filter((it) => it.tick <= curTick).sort((a, b) => a.tick - b.tick);

  $("feed").innerHTML = items.length
    ? items.map((it) => it.html).join("")
    : `<div class="note">Пока никого не убили</div>`;
}

// ---------- Проигрывание ----------
function play() {
  const r = R.data?.replay?.rounds?.[R.round];
  if (!r) return;
  if (R.pos >= r.frames.length - 1) R.pos = 0;   // если раунд закончился — начать заново
  R.playing = true; R.lastTs = 0;
  $("play").textContent = "❚❚ Pause";
  requestAnimationFrame(tick);
}
function stop() {
  R.playing = false;
  $("play").textContent = "▶ Play";
}
function tick(ts) {
  if (!R.playing) return;
  if (R.lastTs) {
    const dt = (ts - R.lastTs) / 1000;
    const fps = TICKRATE / R.data.replay.step;          // кадров в секунду в реальном времени
    R.pos += dt * fps * Number($("speed").value);
    const last = R.data.replay.rounds[R.round].frames.length - 1;
    if (R.pos >= last) { R.pos = last; draw(); return stop(); }
  }
  R.lastTs = ts;
  draw();
  requestAnimationFrame(tick);
}

$("play").addEventListener("click", () => (R.playing ? stop() : play()));
$("seek").addEventListener("input", (e) => { R.pos = Number(e.target.value); draw(); });
</script>
</body>
</html>
